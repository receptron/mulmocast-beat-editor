name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint_test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [22.x, 24.x]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'yarn'
      - run: yarn install --frozen-lockfile
      - run: yarn run typecheck
      - run: yarn run lint
      - run: yarn run build
      - run: yarn run test
      # src/fragment-classes.css is generated from the class names @mulmocast/deck and mulmocast
      # emit, and it is committed so a consumer build does not need the generator. Nothing noticed
      # when it fell behind a mulmocast upgrade — 30 tokens stale, and no gate could see it.
      #
      # One runner is enough: the answer does not vary by OS or Node version, and running it on
      # Windows only invites a checkout that rewrites the line endings the generator did not.
      - name: The generated Tailwind source list is current
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == '24.x'
        shell: bash
        run: |
          yarn run --silent tsx scripts/collect_fragment_classes.ts
          if ! git diff --exit-code -- src/fragment-classes.css; then
            echo '::error::src/fragment-classes.css is stale — run `yarn build:css` and commit it'
            exit 1
          fi
